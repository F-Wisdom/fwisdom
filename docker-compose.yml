version: '3.8'

services:
  # PostgreSQL with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fpt_rag_lab_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fpt_rag_lab
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ASP.NET Core Backend API
  backend:
    build:
      context: ./src/backend
      dockerfile: FptRagLab.API/Dockerfile
    container_name: fpt_rag_lab_backend
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=fpt_rag_lab;Username=postgres;Password=password
      - AiService__BaseUrl=http://ai-service:8000
      - Jwt__Key=YOUR_SUPER_SECRET_KEY_MIN_256_BITS_CHANGE_IN_PRODUCTION
      - Jwt__Issuer=FptRagLabApi
      - Jwt__Audience=FptRagLabClient
      - Cors__AllowedOrigins=http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  # Python AI Service
  ai-service:
    build:
      context: ./src/ai-service
      dockerfile: Dockerfile
    container_name: fpt_rag_lab_ai
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/fpt_rag_lab
      - BACKEND_API_URL=http://backend:80
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=openai
      - OPENAI_MODEL=gpt-4o-mini
      - EMBEDDING_PROVIDER=openai
      - OPENAI_EMBEDDING_MODEL=text-embedding-3-small
    depends_on:
      postgres:
        condition: service_healthy

  # Frontend (React/Vite or Next.js)
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: fpt_rag_lab_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  postgres_data:
